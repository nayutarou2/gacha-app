spring.application.name=gacha-app-backend
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.config.import=optional:file:.env[.properties]
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME}
# spring.datasource.password=${DATABASE_PASSWORD}
mybatis.configuration.map-underscore-to-camel-case=true
spring.flyway.baseline-on-migrate=true

# ===== H2 Database 設定 =====
spring.datasource.driverClassName=org.h2.Driver
# Flywayに読み込ませるフォルダの場所を指定する
spring.flyway.locations=classpath:db/migration/{vendor}
# PostgreSQL互換モードでインメモリ起動
spring.datasource.url=jdbc:h2:mem:gachadb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# プラットフォームを 'h2' に指定する
# spring.sql.init.platform=h2

# H2コンソール（ブラウザでDBの中身を見る機能）を有効化
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MyBatisの場合、起動時にSQLスクリプトを自動実行する設定
# spring.sql.init.mode=always

# 🌟 JWTの設定
# 秘密鍵（セキュリティのため、適当に長い英数字の文字列にしてください。32文字以上必須）
# app.jwt.secret=${JWT_SECRET}
app.jwt.secret=your_super_secret_key_gacha_app_backend_2026_secret

# トークンの有効期限（ミリ秒単位。例：86400000 = 24時間）
app.jwt.expiration-ms=86400000